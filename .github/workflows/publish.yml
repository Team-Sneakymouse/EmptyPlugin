name: Publish Maven

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: maven-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Copies of the template only publish once rename-template.sh has rewritten this to their repository.
    if: github.repository == 'Team-Sneakymouse/EmptyPlugin'
    uses: Team-Sneakymouse/ci/.github/workflows/gradle-publish.yml@main
    secrets:
      INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_IDENTITY_ID }}
      INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
